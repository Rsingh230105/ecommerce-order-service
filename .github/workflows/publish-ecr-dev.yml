name: Publish image to ECR (dev)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable tag matching ecommerce-terraform/terraform.tfvars"
        required: true
        default: v1.0.3
        type: string

permissions:
  contents: read

concurrency:
  group: order-ecr-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ecommerce_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build --tag ecommerce-order-service:${{ github.sha }} .

  publish:
    if: github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ECR_PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
      ECR_REPOSITORY: ecommerce-dev-order-service
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate publish inputs
        run: |
          set -euo pipefail
          if [[ -z "$AWS_REGION" || -z "$AWS_ECR_PUBLISH_ROLE_ARN" ]]; then
            echo "::error::Set AWS_REGION and AWS_ECR_PUBLISH_ROLE_ARN repository variables."
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ || "$IMAGE_TAG" == "latest" ]]; then
            echo "::error::image_tag must be a valid, non-latest Docker tag of at most 128 characters."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check repository and immutable tag
        run: |
          set -euo pipefail
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null
          for tag in "$IMAGE_TAG" "$GITHUB_SHA"; do
            if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$tag" \
              --region "$AWS_REGION" >/dev/null 2>image-check.error; then
              echo "::error::ECR tag $tag already exists. Choose a new commit or version tag."
              exit 1
            elif ! grep -q "ImageNotFoundException" image-check.error; then
              cat image-check.error >&2
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
